    <article>
      <p>“他们说这部电影‘损害形象’、‘影响权威’。但那些心甘情愿花钱买票的人，他们是来看一个可以被自己笑、被自己骂、被自己重新定义的东西。</p>
<p>这部电影最大的价值不在于它拍得好不好，而在于它让观众意识到
<strong>原来评价权可以不属于评委，可以不属于媒体，可以不属于那些‘维护形象’的人。</strong></p>
<p>你可以说它不完美。但你无法说它没有价值，</p>
<p><em>因为那些心甘情愿的笑声，就是它的价值</em>。”</p>
