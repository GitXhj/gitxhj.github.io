<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LONELY · 深夜</title>
</head>
<body>
<script type="module">
/*
 * LONELY —— 深夜独居 · three.js 单页 WebGL 场景
 * three.js 通过 CDN 引入，本文件为浏览器原生 ES Module，无需打包。
 * 通过 <script type="module" src="/lonely-scene.js"> 注入任意页面运行。
 */
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js');
} catch (e) {
  THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.min.js');
}

(() => {
  if (window.__LONELY_INIT__) return;
  window.__LONELY_INIT__ = true;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = THREE.MathUtils.clamp;
  const FAST = /fast/i.test(location.hash);   // 测试加速（不影响正常访问）
  const TS = FAST ? 15 : 1;

  /* ---------------- 覆盖层样式（画布 / 暗角 / LONELY 文字，均不进 3D 场景） ---------------- */
  const style = document.createElement('style');
  style.textContent = `
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@100;200&display=swap');
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; }
    body { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; cursor:default; }
    .lonely-canvas { position:fixed; inset:0; display:block; z-index:1; opacity:0; transition:opacity 3.2s ease; }
    .lonely-canvas.on { opacity:1; }
    .lonely-vignette { position:fixed; inset:0; z-index:5; pointer-events:none;
      background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%); }
    .lonely-text { position:fixed; z-index:10; pointer-events:none;
      font-family:'Jost','Helvetica Neue','Segoe UI',sans-serif; font-weight:100;
      color:rgba(228,234,246,0.30); white-space:nowrap; line-height:1;
      letter-spacing:0.55em; margin-right:-0.55em;
      right:5vw; top:50%; transform:translateY(-50%);
      font-size:clamp(52px, 7vw, 120px);
      opacity:0; animation:lonely-in 5s ease 1.6s forwards; }
    @keyframes lonely-in { to { opacity:1; } }
    @media (max-width:768px) {
      .lonely-text { right:auto; left:50%; top:auto; bottom:6.5vh; transform:translateX(-50%);
        font-size:clamp(26px, 7.5vw, 46px); letter-spacing:0.45em; margin-right:-0.45em; }
    }
  `;
  document.head.appendChild(style);

  const vig = document.createElement('div');
  vig.className = 'lonely-vignette';
  const txt = document.createElement('div');
  txt.className = 'lonely-text';
  txt.textContent = 'LONELY';
  document.body.appendChild(vig);
  document.body.appendChild(txt);

  /* ---------------- 渲染器 / 场景 / 相机 ---------------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.domElement.className = 'lonely-canvas';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030509);
  scene.fog = new THREE.FogExp2(0x030509, 0.0065);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);

  /* ---------------- 灯光：低强度冷色月光，自左上斜射 ---------------- */
  const moon = new THREE.DirectionalLight(0x93a7d2, 1.7);
  moon.position.set(-46, 78, 34);
  scene.add(moon);
  scene.add(new THREE.HemisphereLight(0x1a2540, 0x04050a, 0.55));

  /* ---------------- 楼体 ---------------- */
  const COLS = 25, ROWS = 22, CW = 2.2, CH = 2.6;
  const BW = COLS * CW + 2.4;          // 楼宽 ~57.4m
  const BH = ROWS * CH + 1.6;          // 楼高 ~58.8m
  const winX = c => (c - (COLS - 1) / 2) * CW;
  const winY = r => 1.5 + r * CH;

  function makeWallTexture() {
    const s = 1024, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    g.fillStyle = '#e2e5ea';
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < 26; i++) {           // 大块明暗斑驳
      const x = Math.random() * s, y = Math.random() * s, r = rand(90, 340);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const dark = Math.random() < 0.5;
      gr.addColorStop(0, dark ? 'rgba(96,104,120,0.20)' : 'rgba(255,255,255,0.16)');
      gr.addColorStop(1, 'rgba(128,128,128,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    const im = g.getImageData(0, 0, s, s), d = im.data;   // 细颗粒噪点
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() * 18 - 9) | 0;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    g.putImageData(im, 0, 0);
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    tx.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tx;
  }

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x46536e, map: makeWallTexture(), roughness: 0.94, metalness: 0.02,
  });
  const building = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, 12), wallMat);
  building.position.set(0, BH / 2, -6);   // 正立面 z=0
  scene.add(building);

  /* ---------------- 窗框 / 窗台 / 楼层线（InstancedMesh，性能优先） ---------------- */
  const dummy = new THREE.Object3D();
  const total = COLS * ROWS;

  const frames = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.46, 1.86, 0.10),
    new THREE.MeshStandardMaterial({ color: 0x4d5668, roughness: 0.9, metalness: 0.04 }),
    total,
  );
  const sills = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.78, 0.09, 0.24),
    new THREE.MeshStandardMaterial({ color: 0x525c70, roughness: 0.8 }),
    total,
  );
  const ledges = new THREE.InstancedMesh(
    new THREE.BoxGeometry(BW + 0.5, 0.10, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x333d4f, roughness: 0.95 }),
    ROWS + 1,
  );
  scene.add(frames, sills, ledges);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c, x = winX(c), y = winY(r);
      dummy.position.set(x, y, 0.05); dummy.updateMatrix();
      frames.setMatrixAt(i, dummy.matrix);
      dummy.position.set(x, y - 0.9, 0.12); dummy.updateMatrix();
      sills.setMatrixAt(i, dummy.matrix);
    }
  }
  for (let r = 0; r <= ROWS; r++) {
    dummy.position.set(0, 0.15 + r * CH, 0.04); dummy.updateMatrix();
    ledges.setMatrixAt(r, dummy.matrix);
  }

  /* ---------------- 窗玻璃：instanceColor 控制亮灭 ---------------- */
  function makeGlassTexture() {
    const w = 64, h = 96, cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, h);   // 亮灯时室内上暗下亮的微妙层次
    gr.addColorStop(0, '#c8cdd6');
    gr.addColorStop(0.2, '#f4f5f7');
    gr.addColorStop(0.55, '#ffffff');
    gr.addColorStop(1, '#d6d9df');
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(72,80,94,0.45)';             // 中间十字棂
    g.fillRect(w / 2 - 1.5, 0, 3, h);
    g.fillRect(0, h / 2 - 1.5, w, 3);
    g.strokeStyle = 'rgba(60,68,80,0.30)';
    g.lineWidth = 5;
    g.strokeRect(0, 0, w, h);
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    return tx;
  }

  const glassGeo = new THREE.PlaneGeometry(1.2, 1.6);
  const glassMat = new THREE.MeshBasicMaterial({ map: makeGlassTexture(), fog: false });
  const glass = new THREE.InstancedMesh(glassGeo, glassMat, total - 1);   // 正中间一户单独处理

  const SPECIAL_C = 12, SPECIAL_R = 5;
  const winPos = [];      // 每个实例的世界坐标
  const darkCol = [];     // 熄灭后的颜色（略带差异的近黑）
  const tmpColor = new THREE.Color();
  {
    let i = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c === SPECIAL_C && r === SPECIAL_R) continue;
        const x = winX(c), y = winY(r);
        dummy.position.set(x, y, 0.11); dummy.updateMatrix();
        glass.setMatrixAt(i, dummy.matrix);
        winPos.push(new THREE.Vector3(x, y, 0));
        tmpColor.setHex(0x070a12).multiplyScalar(rand(0.6, 1.25));
        darkCol.push(tmpColor.clone());
        glass.setColorAt(i, tmpColor);
        i++;
      }
    }
  }
  glass.instanceMatrix.needsUpdate = true;
  if (glass.instanceColor) glass.instanceColor.needsUpdate = true;
  scene.add(glass);

  /* ---------------- 正中间那一户：自发光 plane + PointLight + 光晕 sprite ---------------- */
  const spPos = new THREE.Vector3(winX(SPECIAL_C), winY(SPECIAL_R), 0);
  const spMat = new THREE.MeshBasicMaterial({ fog: false });
  const spPlane = new THREE.Mesh(glassGeo, spMat);
  spPlane.position.set(spPos.x, spPos.y, 0.12);
  scene.add(spPlane);

  const spLight = new THREE.PointLight(0xffc98a, 0, 22, 2);
  spLight.position.set(spPos.x, spPos.y, 1.5);
  scene.add(spLight);

  function makeGlowTexture() {
    const s = 256, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,216,155,0.9)');
    gr.addColorStop(0.22, 'rgba(255,199,122,0.42)');
    gr.addColorStop(0.55, 'rgba(255,183,102,0.12)');
    gr.addColorStop(1, 'rgba(255,170,90,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, s, s);
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    return tx;
  }
  const glowTex = makeGlowTexture();
  function makeGlow(w, h, opacity) {
    const m = new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    });
    const sp = new THREE.Sprite(m);
    sp.scale.set(w, h, 1);
    sp.position.set(spPos.x, spPos.y, 0.55);
    scene.add(sp);
    return sp;
  }
  const glowA = makeGlow(7, 7, 0.5);      // 近光晕
  const glowB = makeGlow(17, 13, 0.14);   // 大范围环境微光

  /* ---------------- 地面：一小条几乎看不清的街面 ---------------- */
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(280, 90),
    new THREE.MeshStandardMaterial({ color: 0x161a26, roughness: 1 }),
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, 0, 30);
  scene.add(ground);
  const walk = new THREE.Mesh(
    new THREE.PlaneGeometry(BW + 10, 7.5),
    new THREE.MeshStandardMaterial({ color: 0x232b3d, roughness: 0.96 }),
  );
  walk.rotation.x = -Math.PI / 2;
  walk.position.set(0, 0.02, 4.2);
  scene.add(walk);

  /* ---------------- 夜空：极少量极暗星点（移动端可见，PC 端被楼体遮住） ---------------- */
  {
    const n = 130, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      arr[i * 3] = rand(-180, 180);
      arr[i * 3 + 1] = rand(60, 150);
      arr[i * 3 + 2] = rand(-170, -90);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const m = new THREE.PointsMaterial({
      color: 0x8fa3c8, size: 2.2, sizeAttenuation: false,
      transparent: true, opacity: 0.2, depthWrite: false, fog: false,
    });
    scene.add(new THREE.Points(g, m));
  }

  /* ---------------- 相机取景：PC 仰视取楼体局部，移动端拉远看全楼 ---------------- */
  const mqMobile = window.matchMedia('(max-width: 768px)');
  function applyCamera() {
    const aspect = window.innerWidth / window.innerHeight;
    const portrait = mqMobile.matches || aspect < 0.8;
    if (portrait) {
      camera.fov = 55;
      camera.position.set(0, 10, 66);
      camera.lookAt(0, 26, 0);
    } else {
      camera.fov = 50;
      camera.position.set(0, 7, 29);
      camera.lookAt(0, 12, 0);
    }
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  applyCamera();

  /* ---------------- 初始亮灯：仅可见范围内随机分布，亮度略有差异 ---------------- */
  const proj = new THREE.Vector3();
  const onScreen = k => {
    proj.copy(winPos[k]).project(camera);
    return proj.x > -1.04 && proj.x < 1.04 && proj.y > -1.04 && proj.y < 1.08;
  };

  const lit = [];
  for (let k = 0; k < winPos.length; k++) {
    if (onScreen(k) && Math.random() < 0.16) lit.push(k);
  }
  let guard = 0;
  while (lit.length < 20 && guard++ < 4000) {
    const k = (Math.random() * winPos.length) | 0;
    if (onScreen(k) && lit.indexOf(k) < 0) lit.push(k);
  }
  while (lit.length > 42) lit.splice((Math.random() * lit.length) | 0, 1);

  const warmA = new THREE.Color(0xffb45f), warmB = new THREE.Color(0xffd49a);
  const litCol = [];
  for (const k of lit) {
    tmpColor.copy(warmA).lerp(warmB, Math.random()).multiplyScalar(rand(0.58, 0.92));
    litCol[k] = tmpColor.clone();
    glass.setColorAt(k, tmpColor);
  }
  glass.instanceColor.needsUpdate = true;

  /* ---------------- 声像 / 距离衰减（按窗户投影位置与相机距离） ---------------- */
  const panOf = [], volOf = [];
  function computeSpatial() {
    for (let k = 0; k < winPos.length; k++) {
      proj.copy(winPos[k]).project(camera);
      panOf[k] = clamp(proj.x * 1.15, -1, 1) * 0.85;
      volOf[k] = clamp(38 / camera.position.distanceTo(winPos[k]), 0.5, 1) * rand(0.92, 1.08);
    }
  }
  computeSpatial();

  /* ---------------- Web Audio：合成“关灯”音效（短噪声瞬态 + 低频闷响） ---------------- */
  let AC = null, master = null, noiseBuf = null;
  function initAudio() {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      master = AC.createGain();
      master.gain.value = 0.85;
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.ratio.value = 6;
      master.connect(comp);
      comp.connect(AC.destination);
      const len = (AC.sampleRate * 0.1) | 0;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  }
  initAudio();   // 尝试直接启动；若被浏览器自动播放策略拦下，则任意首次交互后解锁
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, initAudio, { passive: true }));

  function playOff(k) {
    if (!AC || AC.state !== 'running' || !noiseBuf) return;
    const t = AC.currentTime;
    let out = master;
    if (AC.createStereoPanner) {
      const p = AC.createStereoPanner();
      p.pan.value = panOf[k] || 0;
      p.connect(master);
      out = p;
    }
    const vol = Math.min(volOf[k] || 1, 1);
    // 短噪声瞬态：开关“咔哒”
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = rand(2400, 4200);
    bp.Q.value = 1.1;
    const g1 = AC.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.55 * vol, t + 0.005);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + rand(0.04, 0.07));
    src.connect(bp); bp.connect(g1); g1.connect(out);
    src.start(t); src.stop(t + 0.1);
    // 低频闷响：电流断开的余韵
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(rand(150, 195), t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.11);
    const lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 260;
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.32 * vol, t + 0.009);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(lp); lp.connect(g2); g2.connect(out);
    o.start(t); o.stop(t + 0.22);
  }

  /* ---------------- 末尾风声：最后一家熄灯后，风声缓缓浮现（纯合成，无音频文件） ---------------- */
  let windOn = false, windGainRef = null;
  function startWind() {
    if (!AC || windOn) return;
    windOn = true;
    // 循环噪声源：单极点滤波堆出“粉噪”质感，双声道独立生成避免相关性
    const len = (AC.sampleRate * 4) | 0;
    const buf = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let b0 = 0, b1 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.12;
        d[i] = b0 * 0.7 + b1 * 0.35 + w * 0.2;
      }
    }
    const src = AC.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    // 风体：低通截止频率被超慢 LFO 缓缓推移
    const body = AC.createBiquadFilter();
    body.type = 'lowpass'; body.frequency.value = 420; body.Q.value = 0.4;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.06;
    const lfoGain = AC.createGain(); lfoGain.gain.value = 260;
    lfo.connect(lfoGain); lfoGain.connect(body.frequency);
    const bodyGain = AC.createGain(); bodyGain.gain.value = 0.7;
    // 掠过声：带通高频，随阵风同步起伏
    const hiss = AC.createBiquadFilter();
    hiss.type = 'bandpass'; hiss.frequency.value = 1700; hiss.Q.value = 0.5;
    const hissGain = AC.createGain(); hissGain.gain.value = 0.1;
    // 阵风包络：8 秒渐入，之后不规则起伏
    const gust = AC.createGain();
    windGainRef = gust;
    gust.gain.value = 0.0001;
    const t0 = AC.currentTime;
    gust.gain.setValueAtTime(0.0001, t0);
    gust.gain.exponentialRampToValueAtTime(0.45, t0 + 8);
    (function scheduleGust() {
      if (!AC) return;
      gust.gain.setTargetAtTime(rand(0.25, 0.6), AC.currentTime, rand(1.2, 2.6));
      setTimeout(scheduleGust, rand(2800, 6500));
    })();
    // 缓慢漂移的声像，风在夜里有方向感
    const mix = AC.createGain(); mix.gain.value = 0.6;
    const hissMod = AC.createGain(); hissMod.gain.value = 0.35;
    gust.connect(hissMod); hissMod.connect(hissGain.gain);
    src.connect(body); body.connect(bodyGain); bodyGain.connect(mix);
    src.connect(hiss); hiss.connect(hissGain); hissGain.connect(mix);
    mix.connect(gust);
    if (AC.createStereoPanner) {
      const pan = AC.createStereoPanner();
      const panLfo = AC.createOscillator(); panLfo.frequency.value = 0.043;
      const panLfoGain = AC.createGain(); panLfoGain.gain.value = 0.35;
      panLfo.connect(panLfoGain); panLfoGain.connect(pan.pan);
      gust.connect(pan); pan.connect(master);
      panLfo.start(t0);
    } else {
      gust.connect(master);
    }
    src.start(t0); lfo.start(t0);
  }

  /* ---------------- 逐窗熄灭：顺序随机、间隔不规则，偶有长停顿 ---------------- */
  const tweens = [];
  const order = lit.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  let acc = 2.4 / TS;   // 先让夜色安静几秒
  for (const k of order) {
    acc += (Math.random() < 0.13 ? rand(2.2, 5.8) : rand(0.15, 1.5)) * 1000 / TS;
    const delay = acc;
    setTimeout(() => {
      tweens.push({ k, from: litCol[k], to: darkCol[k], t0: performance.now(), dur: 90 });
      playOff(k);
    }, delay);
  }
  setTimeout(startWind, Math.max(0, acc));   // 最后一家熄灯，风声开始

  /* ---------------- 唯一亮着的窗：平时恒定，偶尔轻微闪一下 ---------------- */
  const clock = new THREE.Clock();
  let nextFlickerAt = rand(3, 8);   // 下一次轻微闪烁的时刻
  let flickerEndsAt = -1;           // 当前闪烁段落结束时刻
  function flicker(t) {
    if (t >= nextFlickerAt) {
      flickerEndsAt = t + rand(0.25, 0.9);
      nextFlickerAt = t + rand(4, 10);
    }
    if (t < flickerEndsAt) {
      // 轻微：幅度约 6~9%，拍频式不规则抖动，随即恢复恒定
      return 1
        - 0.06 * Math.abs(Math.sin(t * 37.7)) * Math.abs(Math.sin(t * 23.3 + 1.3))
        - 0.03 * Math.abs(Math.sin(t * 61.1));
    }
    return 1;
  }
  const warmBase = new THREE.Color(1.0, 0.79, 0.52);
  const coolDim = new THREE.Color(0.62, 0.70, 0.92);

  function tick() {
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime() * TS;
    if (tweens.length) {
      const now = performance.now();
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        const a = (now - tw.t0) / tw.dur;
        if (a >= 1) {
          glass.setColorAt(tw.k, tw.to);
          tweens.splice(i, 1);
        } else {
          tmpColor.lerpColors(tw.from, tw.to, a);
          glass.setColorAt(tw.k, tmpColor);
        }
      }
      glass.instanceColor.needsUpdate = true;
    }
    const f = flicker(t);
    spMat.color.copy(warmBase).multiplyScalar(0.58 + 0.5 * f);   // 窗面亮度（常态恒定）
    spMat.color.lerp(coolDim, (1 - Math.min(f, 1)) * 0.5);       // 闪烁瞬间色温微偏冷
    spLight.intensity = 27 * f * f;                              // 照亮周围墙面
    glowA.material.opacity = 0.46 * f;                           // 近光晕
    glowB.material.opacity = 0.13 * f;                           // 大范围微光
    renderer.render(scene, camera);
  }
  tick();
  requestAnimationFrame(() => renderer.domElement.classList.add('on'));

  if (FAST) {
    window.__lonelyDbg = {
      ac: () => AC,
      windStarted: () => windOn,
      windGain: () => (windGainRef ? windGainRef.gain.value : -1),
    };
  }

  /* ---------------- 响应式 ---------------- */
  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      applyCamera();
      renderer.setSize(window.innerWidth, window.innerHeight);
      computeSpatial();
    }, 120);
  });
  window.addEventListener('orientationchange', () => {
    applyCamera();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

</script>
</body>
</html>
